<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Simple Replit</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">Simple Replit</span>
        <button type="button" id="gitBranchBadge" class="git-branch-badge" title="Painel Git" style="display:none;">
          <span class="git-branch-icon">⎇</span>
          <span id="gitBranchName">—</span>
          <span id="gitBranchMeta" class="git-branch-meta"></span>
        </button>
      </div>
      <div id="fileBreadcrumb" class="file-breadcrumb" title=""></div>
      <div class="top-actions">
        <select id="languageSelect" title="Linguagem">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="markdown">Markdown</option>
        </select>
        <button id="btnRun" class="btn btn-primary" title="Rodar (Ctrl+Enter)">▶ <span class="btn-label">Rodar</span></button>
        <button id="btnSave" class="btn" title="Salvar (Ctrl+S)">💾 <span class="btn-label">Salvar</span></button>
        <button id="btnAiTop" class="btn desktop-only" title="Assistente AI">✦ <span class="btn-label">AI</span></button>
        <button id="btnDeploy" class="btn btn-deploy desktop-only" title="Deploy">🚀 <span class="btn-label">Deploy</span></button>
        <button id="btnMore" class="btn desktop-only" title="Mais ações">⋯</button>
        <select id="modeSelect" class="mode-select desktop-only" title="Modo de interface">
          <option value="auto">Auto</option>
          <option value="desktop">💻 PC</option>
          <option value="mobile">📱 Celular</option>
        </select>
      </div>
    </header>

    <!-- Tools sheet (mobile + desktop more menu) -->
    <div id="sheetBackdrop" class="sheet-backdrop" style="display:none;"></div>
    <div id="moreMenu" class="more-menu sheet-panel tools-panel" style="display:none;">
      <div class="sheet-handle mobile-only" aria-hidden="true"></div>
      <div class="sheet-title mobile-only">Tools</div>

      <div class="tools-list">
        <button type="button" class="tool-row" id="btnToolAgent" data-tool="agent">
          <span class="tool-icon tool-icon-agent">✦</span>
          <span class="tool-text">
            <span class="tool-title">Agent</span>
            <span class="tool-desc">Chat com IA e ferramentas do workspace</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnToolShell" data-tool="shell">
          <span class="tool-icon">🐚</span>
          <span class="tool-text">
            <span class="tool-title">Shell</span>
            <span class="tool-desc">Terminal no workspace (whitelist)</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnToolConsole" data-tool="console">
          <span class="tool-icon">💻</span>
          <span class="tool-text">
            <span class="tool-title">Console</span>
            <span class="tool-desc">Saída de execução e logs</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnToolFiles" data-tool="files">
          <span class="tool-icon">📁</span>
          <span class="tool-text">
            <span class="tool-title">Files</span>
            <span class="tool-desc">Árvore de arquivos do projeto</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnGitPanel">
          <span class="tool-icon">⎇</span>
          <span class="tool-text">
            <span class="tool-title">Git</span>
            <span class="tool-desc">Status, diff, commit, pull e push</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnGitDiff">
          <span class="tool-icon">📝</span>
          <span class="tool-text">
            <span class="tool-title">Git Diff</span>
            <span class="tool-desc">Diff visual Monaco</span>
          </span>
        </button>
        <button type="button" class="tool-row btn-deploy-row" id="btnDeploySheet">
          <span class="tool-icon">🚀</span>
          <span class="tool-text">
            <span class="tool-title">Deploy</span>
            <span class="tool-desc">Pull + build docker com log ao vivo</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnBackup">
          <span class="tool-icon">💾</span>
          <span class="tool-text">
            <span class="tool-title">Backup</span>
            <span class="tool-desc">Salvar snapshot tar.gz do workspace</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnRestore">
          <span class="tool-icon">♻</span>
          <span class="tool-text">
            <span class="tool-title">Restore</span>
            <span class="tool-desc">Restaurar backup anterior</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnRestartApp">
          <span class="tool-icon">↻</span>
          <span class="tool-text">
            <span class="tool-title">Restart App</span>
            <span class="tool-desc">docker compose restart app</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnMonitor">
          <span class="tool-icon">📊</span>
          <span class="tool-text">
            <span class="tool-title">Monitor</span>
            <span class="tool-desc">Status do app e containers</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnLogs">
          <span class="tool-icon">📋</span>
          <span class="tool-text">
            <span class="tool-title">Workflow Logs</span>
            <span class="tool-desc">Logs do deploy em stream</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnLogsAll">
          <span class="tool-icon">📦</span>
          <span class="tool-text">
            <span class="tool-title">All Logs</span>
            <span class="tool-desc">Logs gerais do ambiente</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnStopLogs" style="display:none;">
          <span class="tool-icon">⏹</span>
          <span class="tool-text">
            <span class="tool-title">Parar Logs</span>
            <span class="tool-desc">Encerra streams ativos</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnApiKeys">
          <span class="tool-icon">🔑</span>
          <span class="tool-text">
            <span class="tool-title">Secrets / API Keys</span>
            <span class="tool-desc">Editar .env (chaves de provedores)</span>
          </span>
        </button>
        <button type="button" class="tool-row" id="btnSecrets">
          <span class="tool-icon">🔒</span>
          <span class="tool-text">
            <span class="tool-title">List Secrets</span>
            <span class="tool-desc">Ver quais keys estão setadas</span>
          </span>
        </button>
      </div>

      <!-- hidden legacy git buttons for existing handlers -->
      <div style="display:none;">
        <button id="btnAiPanel" type="button">AI</button>
        <button id="btnGitStatus" type="button">Git Status</button>
        <button id="btnGitPull" type="button">Git Pull</button>
        <button id="btnGitCommit" type="button">Git Commit</button>
        <button id="btnGitPush" type="button">Git Push</button>
      </div>

      <div class="sheet-section sheet-mode-section mobile-only">
        <div class="sheet-mode-row">
          <label for="modeSelectMobile">Interface</label>
          <select id="modeSelectMobile">
            <option value="auto">Auto</option>
            <option value="desktop">💻 PC</option>
            <option value="mobile">📱 Celular</option>
          </select>
        </div>
      </div>
      <button type="button" id="btnCloseSheet" class="btn sheet-close mobile-only">Fechar</button>
    </div>

    <div class="main">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span>Arquivos</span>
          <div class="sidebar-actions">
            <button id="btnNewFile" title="Novo arquivo">＋</button>
            <button id="btnNewFolder" title="Nova pasta">📁</button>
            <button id="btnRefresh" title="Atualizar">↻</button>
          </div>
        </div>
        <div id="fileTree" class="file-tree"></div>
      </aside>
      <div id="sidebarOverlay" class="sidebar-overlay mobile-only" style="display:none;"></div>

      <div class="editor-area">
        <div id="editorTabs" class="editor-tabs" aria-label="Abas abertas"></div>
        <div id="editor" class="editor"></div>
        <div class="console-panel">
          <div class="console-header">
            <div class="console-tabs">
              <button class="tab active" data-tab="console">Console</button>
              <button class="tab" data-tab="shell">Shell</button>
              <button class="tab" data-tab="ai">AI</button>
            </div>
            <div class="ai-model-select" id="aiModelWrap" style="display:none;">
              <select id="aiModel">
                <option value="groq-fast">Groq 8B (rápido/barato)</option>
                <option value="groq-quality">Groq 120B</option>
                <option value="deepseek-flash">DeepSeek Flash</option>
                <option value="deepseek-pro">DeepSeek Pro</option>
              </select>
            </div>
            <button id="btnClearConsole" class="btn-small">Limpar</button>
          </div>
          <pre id="consoleOutput" class="console-output"></pre>
          <div id="xtermContainer" class="xterm-container" style="display:none;"></div>
          <div id="aiChatArea" class="ai-chat-area" style="display:none;">
            <div id="aiQuickPrompts" class="ai-quick-prompts">
              <button type="button" class="ai-chip" data-prompt="Explique o arquivo aberto de forma simples">Explicar arquivo</button>
              <button type="button" class="ai-chip" data-prompt="Encontre bugs ou problemas no código aberto e sugira correção">Achar bugs</button>
              <button type="button" class="ai-chip" data-prompt="Melhore este código mantendo a mesma função">Melhorar código</button>
              <button type="button" class="ai-chip" data-prompt="Crie um arquivo Python hello.py que imprime Olá">Criar hello.py</button>
              <button type="button" class="ai-chip" data-prompt="Liste os arquivos importantes deste projeto e o que cada um faz">Mapear projeto</button>
            </div>
            <div id="aiMessages" class="ai-messages"></div>
            <div class="ai-input-row">
              <textarea id="aiInput" rows="2" placeholder="Descreva o que quer criar ou mudar..."></textarea>
              <button id="btnAiSend" class="btn btn-primary">Enviar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom tab bar (Replit-style mobile) -->
    <nav id="bottomNav" class="bottom-nav mobile-only" aria-label="Navegação mobile">
      <button type="button" class="bnav-item active" data-view="files" title="Arquivos">
        <span class="bnav-icon">📁</span>
        <span class="bnav-label">Files</span>
      </button>
      <button type="button" class="bnav-item" data-view="code" title="Código">
        <span class="bnav-icon">✏️</span>
        <span class="bnav-label">Code</span>
      </button>
      <button type="button" class="bnav-item" data-view="shell" title="Shell">
        <span class="bnav-icon">🐚</span>
        <span class="bnav-label">Shell</span>
      </button>
      <button type="button" class="bnav-item bnav-agent" data-view="agent" title="Agent">
        <span class="bnav-icon">✦</span>
        <span class="bnav-label">Agent</span>
      </button>
      <button type="button" class="bnav-item" data-action="tools" title="Tools">
        <span class="bnav-icon">🔧</span>
        <span class="bnav-label">Tools</span>
      </button>
    </nav>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
