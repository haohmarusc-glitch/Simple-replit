<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Simple Replit</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">Simple Replit</span>
      </div>
      <div id="fileBreadcrumb" class="file-breadcrumb" title=""></div>
      <div class="top-actions">
        <select id="languageSelect" title="Linguagem">
          <option value="python">Python</option>
          <option value="javascript">JavaScript</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="markdown">Markdown</option>
        </select>
        <button id="btnRun" class="btn btn-primary" title="Rodar (Ctrl+Enter)">▶ <span class="btn-label">Rodar</span></button>
        <button id="btnSave" class="btn" title="Salvar (Ctrl+S)">💾 <span class="btn-label">Salvar</span></button>
        <button id="btnDeploy" class="btn btn-deploy desktop-only" title="Deploy">🚀 <span class="btn-label">Deploy</span></button>
        <button id="btnMore" class="btn desktop-only" title="Mais ações">⋯</button>
        <select id="modeSelect" class="mode-select desktop-only" title="Modo de interface">
          <option value="auto">Auto</option>
          <option value="desktop">💻 PC</option>
          <option value="mobile">📱 Celular</option>
        </select>
      </div>
    </header>

    <!-- Bottom sheet (mobile) + dropdown (desktop) -->
    <div id="sheetBackdrop" class="sheet-backdrop" style="display:none;"></div>
    <div id="moreMenu" class="more-menu sheet-panel" style="display:none;">
      <div class="sheet-handle mobile-only" aria-hidden="true"></div>
      <div class="sheet-title mobile-only">Ações</div>
      <div class="sheet-section">
        <div class="sheet-section-label">Git</div>
        <button id="btnGitStatus" class="btn">Git Status</button>
        <button id="btnGitDiff" class="btn">Git Diff</button>
        <button id="btnGitPull" class="btn">Git Pull</button>
        <button id="btnGitCommit" class="btn">Git Commit</button>
        <button id="btnGitPush" class="btn">Git Push</button>
      </div>
      <div class="sheet-section">
        <div class="sheet-section-label">Deploy &amp; App</div>
        <button id="btnDeploySheet" class="btn btn-deploy">🚀 Deploy</button>
        <button id="btnBackup" class="btn">💾 Salvar Backup</button>
        <button id="btnRestore" class="btn">♻ Restaurar Backup</button>
        <button id="btnRestartApp" class="btn">↻ Restart App</button>
        <button id="btnMonitor" class="btn">📊 Monitor</button>
      </div>
      <div class="sheet-section">
        <div class="sheet-section-label">Logs</div>
        <button id="btnLogs" class="btn btn-logs">📋 Workflow Logs</button>
        <button id="btnLogsAll" class="btn btn-logs">📦 All Logs</button>
        <button id="btnStopLogs" class="btn btn-stop" style="display:none;">⏹ Parar Logs</button>
      </div>
      <div class="sheet-section">
        <div class="sheet-section-label">Config</div>
        <button id="btnApiKeys" class="btn btn-keys">🔑 API Keys</button>
        <button id="btnSecrets" class="btn btn-keys">🔒 Secrets</button>
        <div class="sheet-mode-row mobile-only">
          <label for="modeSelectMobile">Interface</label>
          <select id="modeSelectMobile">
            <option value="auto">Auto</option>
            <option value="desktop">💻 PC</option>
            <option value="mobile">📱 Celular</option>
          </select>
        </div>
      </div>
      <button type="button" id="btnCloseSheet" class="btn sheet-close mobile-only">Fechar</button>
    </div>

    <div class="main">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span>Arquivos</span>
          <div class="sidebar-actions">
            <button id="btnNewFile" title="Novo arquivo">＋</button>
            <button id="btnNewFolder" title="Nova pasta">📁</button>
            <button id="btnRefresh" title="Atualizar">↻</button>
          </div>
        </div>
        <div id="fileTree" class="file-tree"></div>
      </aside>
      <div id="sidebarOverlay" class="sidebar-overlay mobile-only" style="display:none;"></div>

      <div class="editor-area">
        <div id="editorTabs" class="editor-tabs" aria-label="Abas abertas"></div>
        <div id="editor" class="editor"></div>
        <div class="console-panel">
          <div class="console-header">
            <div class="console-tabs">
              <button class="tab active" data-tab="console">Console</button>
              <button class="tab" data-tab="shell">Shell</button>
              <button class="tab" data-tab="ai">AI</button>
            </div>
            <div class="ai-model-select" id="aiModelWrap" style="display:none;">
              <select id="aiModel">
                <option value="groq-fast">Groq 8B (rápido/barato)</option>
                <option value="groq-quality">Groq 120B</option>
                <option value="deepseek-flash">DeepSeek Flash</option>
                <option value="deepseek-pro">DeepSeek Pro</option>
              </select>
            </div>
            <button id="btnClearConsole" class="btn-small">Limpar</button>
          </div>
          <pre id="consoleOutput" class="console-output"></pre>
          <div id="xtermContainer" class="xterm-container" style="display:none;"></div>
          <div id="aiChatArea" class="ai-chat-area" style="display:none;">
            <div id="aiQuickPrompts" class="ai-quick-prompts">
              <button type="button" class="ai-chip" data-prompt="Explique o arquivo aberto de forma simples">Explicar arquivo</button>
              <button type="button" class="ai-chip" data-prompt="Encontre bugs ou problemas no código aberto e sugira correção">Achar bugs</button>
              <button type="button" class="ai-chip" data-prompt="Melhore este código mantendo a mesma função">Melhorar código</button>
              <button type="button" class="ai-chip" data-prompt="Crie um arquivo Python hello.py que imprime Olá">Criar hello.py</button>
              <button type="button" class="ai-chip" data-prompt="Liste os arquivos importantes deste projeto e o que cada um faz">Mapear projeto</button>
            </div>
            <div id="aiMessages" class="ai-messages"></div>
            <div class="ai-input-row">
              <textarea id="aiInput" rows="2" placeholder="Descreva o que quer criar ou mudar..."></textarea>
              <button id="btnAiSend" class="btn btn-primary">Enviar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <button type="button" id="btnToggleSideNav" class="side-nav-toggle mobile-only" title="Menu" aria-label="Abrir menu">⋯</button>
    <nav id="bottomNav" class="side-nav mobile-only" aria-label="Navegação mobile">
      <button type="button" class="bnav-item" data-action="close-nav" title="Fechar">
        <span class="bnav-icon">⋯</span>
        <span class="bnav-label">Fechar</span>
      </button>
      <button type="button" class="bnav-item active" data-view="files" title="Arquivos">
        <span class="bnav-icon">📁</span>
        <span class="bnav-label">Arquivos</span>
      </button>
      <button type="button" class="bnav-item" data-view="code" title="Código">
        <span class="bnav-icon">✏️</span>
        <span class="bnav-label">Código</span>
      </button>
      <button type="button" class="bnav-item" data-view="console" title="Console">
        <span class="bnav-icon">💻</span>
        <span class="bnav-label">Console</span>
      </button>
      <button type="button" class="bnav-item" data-view="ai" title="AI">
        <span class="bnav-icon">🤖</span>
        <span class="bnav-label">AI</span>
      </button>
      <button type="button" class="bnav-item" data-action="more" title="Mais">
        <span class="bnav-icon">⚡</span>
        <span class="bnav-label">Mais</span>
      </button>
    </nav>
    <div id="sideNavBackdrop" class="side-nav-backdrop mobile-only" style="display:none;"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
